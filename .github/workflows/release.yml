# On every push to main, releases the version in PADChat.toc as tag v<version>
# with an installable PADChat-<version>.zip. If that tag already exists, the
# patch number goes up until it's free, and after a successful release the new
# version is committed to PADChat.toc and pushed.
# Run it by hand (Actions > Release > Run workflow) to release the chosen branch,
# optionally under another version.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.1 (blank = ## Version in PADChat.toc)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package and release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -e
          toc_version=$(sed -n 's/^## Version: *//p' PADChat.toc | tr -d '\r')
          version="${INPUT_VERSION#v}"
          version="${version:-$toc_version}"
          while git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; do
            version="${version%.*}.$(( ${version##*.} + 1 ))"
          done
          tag="v$version"
          echo "Releasing $tag"

          # The zip holds a PADChat folder, ready to drop into Interface/AddOns.
          mkdir -p build/PADChat
          cp -r PADChat.toc *.lua Media LICENSE README.md build/PADChat/
          sed -i "s/^## Version:.*/## Version: $version/" build/PADChat/PADChat.toc
          (cd build && zip -r "../PADChat-$version.zip" PADChat)

          # Notes are this version's README changelog section, or GitHub's
          # generated notes when it has none (such as an auto-bumped version).
          awk -v heading="### $version" '$0 == heading { on = 1; next } on && /^##/ { exit } on' README.md > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi

          gh release create "$tag" "PADChat-$version.zip" --target "$GITHUB_SHA" --title "PADChat $version" "${notes[@]}"

          # Keep the repo's toc on the version just released.
          if [ "$version" != "$toc_version" ]; then
            cp build/PADChat/PADChat.toc PADChat.toc
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Release $version"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
